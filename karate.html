<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaté Shinka-ryu — Scoreboard</title>
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>

<div class="shell">

  <header class="head">
    <div class="head-left">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3l2.4 5.6L20 10l-4.4 3.4L17 19l-5-2.9L7 19l1.4-5.6L4 10l5.6-1.4z"/>
        </svg>
      </div>
      <div class="titles">
        <h1 id="board-title">Karaté Shinka-ryu</h1>
        <div class="subtitle">Statistiques hebdomadaires<span class="warn-pill" id="data-warning" hidden></span></div>
      </div>
    </div>

    <div class="head-right">
      <div class="week-pill">
        <span class="k">Période</span>
        <span class="v" id="week-value">—</span>
      </div>
      <div class="clock">
        <div class="t" id="clock-time">—</div>
        <div class="d" id="clock-date"></div>
      </div>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <footer class="foot">
    <div class="legend">
      <span><i class="g"></i>Objectif atteint</span>
      <span><i class="a"></i>Proche (80 %+)</span>
      <span><i class="r"></i>Sous l'objectif</span>
    </div>
    <div class="sync">
      <span class="dot" id="dot"></span>
      <span id="sync-text">Connexion…</span>
    </div>
  </footer>

</div>

<!-- chargement -->
<div class="overlay" id="loading">
  <div class="box">
    <div class="spinner"></div>
    <p>Chargement des données…</p>
  </div>
</div>

<!-- erreur / configuration manquante -->
<div class="overlay" id="error" hidden>
  <div class="box">
    <h2>Données indisponibles</h2>
    <p id="error-msg"></p>
  </div>
</div>

<script src="config.js?v=13" charset="utf-8"></script>
<script src="app.js?v=13" charset="utf-8"></script>
<script>boot("karate");</script>
</body>
</html>
